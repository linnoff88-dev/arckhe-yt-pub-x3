<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YT-Pub X3 Master</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e4e4e7;--muted:#a1a1aa;--accent:#818cf8;--acc2:#6366f1;--green:#4ade80;--yellow:#eab308;--red:#f87171;--blue:#60a5fa;--pink:#f472b6;--violet:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:1800px;margin:auto;padding:18px 16px 40px}header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}header h1{font-size:22px}header h1 span{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px;align-items:center}.badge{padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--card)}.badge.p{color:var(--yellow)}.badge.on{color:var(--green)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.s{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px}.s b{display:block;font-size:24px}.s span{color:var(--muted);font-size:13px}
.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.blue{color:var(--blue)}.pink{color:var(--pink)}.violet{color:var(--violet)}.mut{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.f{min-height:38px;padding:4px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--muted)}.f.on{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,390px),1fr));gap:12px}.inst{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:8px;padding:12px;min-width:0}.inst.warn{border-left-color:var(--yellow)}.inst.bad{border-left-color:var(--red)}.inst.off{border-left-color:#52525b}
.ih{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;margin-bottom:10px}.ih h2{font-size:16px}.ih small{display:block;color:var(--muted);font-size:13px;margin-top:2px}.tag{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.06)}
.links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.lk{display:inline-flex;align-items:center;min-height:34px;padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:rgba(255,255,255,.04);color:#c7d2fe;font-size:13px;text-decoration:none}.lk:hover{border-color:var(--accent);color:#fff}
.pipes{display:flex;gap:8px;margin-bottom:10px}.pipe{flex:1;min-width:0;border-radius:6px;padding:8px 10px;background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.18)}.pipe.rs{background:rgba(244,114,182,.06);border-color:rgba(244,114,182,.2)}.pipe.cut{background:rgba(96,165,250,.07);border-color:rgba(96,165,250,.25);margin-bottom:10px}
.pt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}.pn{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.pn b{font-size:20px}.pn span{font-size:13px;font-weight:700;color:var(--yellow)}.pl{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.pl strong{color:var(--text);font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:8px}th{color:var(--muted);font-weight:500;text-align:right;padding:2px 5px}td{text-align:right;padding:2px 5px;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}
.chart{background:rgba(255,255,255,.03);border-radius:6px;padding:6px 8px;margin-bottom:8px}.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;color:var(--muted);font-size:13px}.ct{display:flex;gap:3px}.cb{min-width:38px;min-height:30px;padding:1px 6px;font-size:12px;border:0;border-radius:4px;background:rgba(255,255,255,.08);color:var(--muted)}.cb.on{background:var(--acc2);color:#fff}svg{display:block;width:100%;height:58px}.cf{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:2px}
.open{width:100%;min-height:40px;background:rgba(99,102,241,.16);border:1px solid rgba(129,140,248,.4);border-radius:6px;font-weight:600;color:#c7d2fe}.back{min-height:40px;padding:4px 14px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:12px}.dt{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:10px}.dt h2{font-size:21px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px}.t{min-height:44px;padding:6px 18px;background:0;border:0;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}.t.on{color:var(--text);border-bottom-color:var(--accent)}
.box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}.hs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.h{font-size:13px;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.07)}.fit{margin:8px 0 0;color:var(--muted)}.fit.no{color:var(--red)}
.sw{min-height:42px;min-width:116px;padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.05);font-weight:600}.sw.on{background:#166534;border-color:#22c55e;color:#dcfce7}.conns{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.conn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}.conn h3{font-size:15px}.conn p{margin:0;color:var(--muted)}.conn .st2{color:var(--text);font-weight:600}
.sec{font-size:15px;font-weight:700;margin:14px 0 8px}.vs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:10px}.v{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:0}.v h3{font-size:14.5px}.m{color:var(--muted);font-size:13px}.ds{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px}.d{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:6px;padding:8px}.n{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)}.st{font-weight:700}.st.feito{color:var(--green)}.st.erro,.st.conferir{color:var(--red)}.st.aguardando,.st.enviando{color:var(--yellow)}.st.pausado,.st.ignorado{color:var(--muted)}.why{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.as{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.a{min-height:38px;padding:2px 10px;background:0;border:1px solid #3f3f50;border-radius:5px;font-size:13px}.a:hover{border-color:var(--accent)}
</style></head><body><div class="wrap" id="app">Carregando…</div>
<script>
'use strict';
const app=document.getElementById('app');let E=null,sel=null,tab='yt',filtro='todos',det=null;const per={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>/^https:\/\//.test(u||'')?esc(u):'#';
const NOM={aguardando:'Aguardando',enviando:'Enviando',feito:'Feito',erro:'Erro',pausado:'Pausado',ignorado:'Ignorado',conferir:'Conferir'};
const ACS={aguardando:['pausar','pular'],pausado:['retomar','pular'],erro:['reenviar','pular'],conferir:['confirmar','reenviar','pular'],ignorado:['reenviar']};
const ROT={pausar:'Pausar',pular:'Pular',retomar:'Retomar',reenviar:'Reenviar',confirmar:'Já publicou'};
const soma=a=>(a||[]).reduce((x,y)=>x+y,0);
function dados(c){const l=c.legado||{},i=l.imports||[0,0,0,0,0],k=l.clips||[0,0,0,0,0],y=l.yt||[0,0,0,'–',0],y3=c.destinos.youtube.n,r3=c.destinos.rs.n;
 const p24=i[4]+k[4]+y[4]+(y3.h24||0),nh=c.youtube.horarios.length,est=c.semana>c.vagas,fila=(i[1]||0)+(y3.aguardando||0);
 const paus=!c.destinos.youtube.ligado,pz=c.destinos.youtube.pausa;let nv='ok',st='Normal';
 if(pz){nv='bad';st='YouTube pausado'}else if(paus){nv='off';st='Desligado'}else if(!nh){nv='off';st='Sem horário'}else if(est){nv='bad';st='Não cabe'}else if(fila>30){nv='warn';st='Fila cheia'}
 return{l,i,k,y,y3,r3,p24,nh,est,fila,nv,st,tot:i[2]+k[2]+y[0]+(y3.feito||0)}}
function links(c){const a=[],r=c.rs;if(c.url)a.push(['YouTube',c.url]);if(r.provedor&&r.blog_id)a.push(['Metricool '+r.marca,'https://app.metricool.com/planner/calendar?blogId='+r.blog_id]);if(r.instagram)a.push(['Instagram','https://www.instagram.com/'+r.instagram+'/']);if(r.tiktok)a.push(['TikTok','https://www.tiktok.com/@'+r.tiktok]);
 return '<div class="links">'+a.map(x=>`<a class="lk" href="${url(x[1])}" target="_blank" rel="noopener">${esc(x[0])} ↗</a>`).join('')+'</div>'}
function prox(h){const d=new Date(),a=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');return h.length?(h.find(x=>x>a)||'amanhã '+h[0]):'sem horário'}
function grafico(c){const n=per[c.nome]||14,a=(c.legado.historico||[]).slice(-n),m=Math.max(1,...a),W=320,H=60,s=W/Math.max(1,a.length-1),p=a.map((v,i)=>(i*s).toFixed(1)+','+(H-4-v/m*(H-10)).toFixed(1)).join(' ');
 return `<div class="chart"><div class="ch"><span>Publicações no YouTube</span><div class="ct">${[7,14,30].map(x=>`<button class="cb ${n==x?'on':''}" data-per="${esc(c.nome)}:${x}">${x}d</button>`).join('')}</div></div><svg viewBox="0 0 320 60" preserveAspectRatio="none" role="img" aria-label="Soma ${soma(a)}, pico ${Math.max(0,...a)}"><polygon points="0,60 ${p} 320,60" fill="rgba(74,222,128,.12)"/><polyline points="${p}" fill="none" stroke="#4ade80" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="cf"><span>${n} dias</span><span>pico ${Math.max(0,...a)} · soma ${soma(a)}</span><span>ontem</span></div></div>`}
function linha(n,cor,v){const e=typeof v[3]==='number'&&v[3]>0?'red':'mut';return `<tr><td class="${cor}">${n}</td><td>${v[0]}</td><td class="yellow">${v[1]}</td><td class="green">${v[2]}</td><td class="${e}">${v[3]}</td><td class="blue">${v[4]}</td></tr>`}
function cartao(c){const d=dados(c),r=c.rs,ct=c.cortes,L=d.l.lives||[0,0,0,0,0];
 return `<div class="inst ${d.nv==='ok'?'':d.nv}"><div class="ih"><div><h2>${esc(c.nome)} <span class="green" style="font-size:13px">${d.p24} em 24 h</span></h2><small>${esc(c.titulo)}${c.ativo?' · no x3':''}</small></div><span class="tag">${esc(d.st)}</span></div>${links(c)}
 <div class="pipes"><div class="pipe"><div class="pt green">Import YT</div><div class="pn"><b class="green">${d.p24}</b><span>${d.nh}/dia</span></div><div class="pl">Próx: <strong>${esc(c.destinos.youtube.ligado?prox(c.youtube.horarios):'desligado')}</strong></div><div class="pl">Total: <strong>${d.tot}</strong></div></div>
 <div class="pipe rs"><div class="pt pink">RS</div><div class="pn"><b class="pink">${d.r3.h24||0}</b><span>${d.r3.aguardando||0} fila</span></div><div class="pl"><strong>${esc(r.marca||'Sem RS')}</strong></div><div class="pl">${esc(r.provedor?(c.destinos.rs.ligado?r.redes.join(' + '):(r.nota||'Desligado')):(r.nota||'Nenhuma marca'))}</div></div></div>
 ${ct.ligado?`<div class="pipe cut"><div class="pt blue">Cortes de lives · ativo</div><div class="pn"><b class="blue">${L[4]}</b><span>${ct.max_por_dia}/dia</span></div><div class="pl">Próx: <strong>${esc(prox(ct.horarios))}</strong> · Último: <strong>${esc((d.l.ultimo_corte||'–').slice(5,16))}</strong></div><div class="pl">${L[2]} cortadas · ${L[1]} pendentes · ${L[3]} erros</div></div>`:''}
 <div class="tw"><table><thead><tr><th>Origem</th><th>Total</th><th>Pend</th><th>Pub</th><th>Erros</th><th>24h</th></tr></thead><tbody>${L[0]?linha('Lives','blue',L):''}${linha('Clips','',d.k)}${linha('Imports','violet',d.i)}${linha('yt-pubx','blue',d.y)}${linha('X3 YouTube','green',[(d.y3.feito||0)+(d.y3.aguardando||0)+(d.y3.erro||0),d.y3.aguardando||0,d.y3.feito||0,d.y3.erro||0,d.y3.h24||0])}${r.provedor?linha('X3 RS','pink',[(d.r3.feito||0)+(d.r3.aguardando||0)+(d.r3.erro||0),d.r3.aguardando||0,d.r3.feito||0,d.r3.erro||0,d.r3.h24||0]):''}</tbody></table></div>${grafico(c)}<button class="open" data-abre="${esc(c.nome)}">Abrir canal</button></div>`}
function telaGeral(){const cs=E.canais.map(c=>[c,dados(c)]),T=[['Canais',E.canais.length,''],['Publicados em 24 h',soma(cs.map(x=>x[1].p24)),'green'],['Na fila',soma(cs.map(x=>x[1].fila)),'yellow'],['Com RS ligada',cs.filter(x=>x[0].destinos.rs.ligado&&x[0].rs.provedor).length,'pink'],['Não cabem',cs.filter(x=>x[1].est).length,'red'],['No x3',cs.filter(x=>x[0].ativo).length,'violet'],['Recusados',E.recusados.length,'red']];
 const FS={todos:['Todos',()=>1],rs:['Com RS',x=>x[0].rs.provedor],nao:['Não cabem',x=>x[1].est],fila:['Fila cheia',x=>x[1].fila>30],x3:['No x3',x=>x[0].ativo]};
 return `<div class="sum">${T.map(t=>`<div class="s"><b class="${t[2]}">${t[1]}</b><span>${t[0]}</span></div>`).join('')}</div><div class="filters">${Object.entries(FS).map(([k,v])=>`<button class="f ${filtro==k?'on':''}" data-f="${k}">${v[0]}</button>`).join('')}</div><div class="grid">${cs.filter(FS[filtro][1]).map(x=>cartao(x[0])).join('')}</div>${E.recusados.length?`<div class="sec">Recusados</div>${E.recusados.map(r=>`<div class="box"><strong>${esc(r.canal)}</strong> · ${esc(r.motivo)}<div class="m">${esc(r.pasta)}</div></div>`).join('')}`:''}`}
function entrega(e,it){return `<div class="d"><div class="n">${e.destino==='rs'?'RS':'YouTube'}</div><div class="st ${esc(e.status)}">${esc(NOM[e.status]||e.status)}</div><div class="why">${esc(e.motivo)}${e.url?` <a class="lk" href="${url(e.url)}" target="_blank" rel="noopener">Abrir ↗</a>`:''}</div><div class="as">${(ACS[e.status]||[]).map(a=>`<button class="a" data-ent="${e.id}/${a}" aria-label="${ROT[a]}: ${esc(it.titulo)}">${ROT[a]}</button>`).join('')}</div></div>`}
function telaCanal(){const c=E.canais.find(x=>x.nome===sel),d=dados(c),y=c.destinos.youtube,r=c.destinos.rs,L=d.l.lives||[0,0,0,0,0];let b='';
 const sw=(dst,on)=>`<button class="sw ${on?'on':''}" data-sw="${c.nome}/${dst}/${on?'desligar':'ligar'}" aria-pressed="${on}">${on?'Ligado':'Desligado'}</button>`;
 if(tab==='yt')b=`<div class="box"><div class="row"><div><div class="mut">Publicação no YouTube</div><strong>${y.pausa?'Pausada até '+esc(y.retomar_em.slice(0,16)):'1 vídeo por horário'}</strong></div>${sw('youtube',y.ligado)}</div>${y.pausa?`<p class="fit no">${esc(y.pausa)}</p>`:''}<div class="hs">${c.youtube.horarios.map(h=>`<span class="h">${esc(h)}</span>`).join('')}</div><p class="fit ${d.est?'no':''}">${d.nh?`${d.est?'Não cabe':'Cabe'}: ${c.semana} vídeos em 7 dias, ${c.vagas} vagas por semana.`:'Sem horário de import.'}</p><p class="fit">Capa: Codex quando o YouTube permite. Short não leva capa.</p></div>`;
 if(tab==='rs')b=`<div class="conns"><div class="conn"><h3>Metricool</h3><p class="st2">${c.rs.marca?'Marca '+esc(c.rs.marca):'Sem marca'}</p><p>${esc(c.rs.marca?c.rs.redes.join(' + '):(c.rs.nota||'Escolha uma marca no arquivo do canal.'))}</p>${c.rs.nota&&c.rs.marca?`<p>${esc(c.rs.nota)}</p>`:''}${c.rs.provedor?sw('rs',r.ligado):''}</div><div class="conn"><h3>Blotato</h3><p class="st2">Falta conectar</p><p>Precisa de conta e chave.</p></div><div class="conn"><h3>Upload-Post</h3><p class="st2">Desligado</p><p>Precisa de autorização e chave.</p></div></div><p class="fit">${r.pausa?esc(r.pausa):'Horário das redes: o mesmo do Import YT, com 1 h entre posts da mesma marca.'}</p>`;
 if(tab==='cut')b=`<div class="box"><div class="mut">Cortes de lives</div><strong>${c.cortes.ligado?'Ativo':'Desligado'}</strong><div class="hs">${c.cortes.horarios.map(h=>`<span class="h">${esc(h)}</span>`).join('')}</div><p class="fit">${L[2]} cortadas de ${L[0]} · ${L[1]} pendentes · ${L[3]} erros · último ${esc((d.l.ultimo_corte||'–').slice(0,16))}</p></div>${(det?.lives||[]).map(l=>`<div class="box"><strong>${esc(l.titulo)}</strong><div class="m">${esc(l.status)} · ${l.qtd_clips} clipes ${esc(l.erro)}</div></div>`).join('')}`;
 const it=det?.itens||[];
 return `<button class="back" data-volta="1">‹ Todos os canais</button><div class="dt"><h2>${esc(c.nome)} · ${esc(c.titulo)}</h2><span class="tag">${esc(d.st)}</span></div>${links(c)}<div class="tabs">${[['yt','Import YT'],['rs','RS'],['cut','Cortes']].map(t=>`<button class="t ${tab==t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${b}<div class="sec">Publicações na fila do x3</div>${it.length?`<div class="vs">${it.map(i=>`<div class="v"><h3>${esc(i.titulo)}</h3><div class="m">#${i.id} · ${esc(i.tipo)}${i.duracao?' · '+i.duracao+' s':''} · ${esc(i.quando)} · capa: ${esc(i.capa)} ${esc(i.capa_motivo)}</div><div class="ds">${i.entregas.map(e=>entrega(e,i)).join('')}</div></div>`).join('')}</div>`:'<div class="box mut">Nada na fila deste canal.</div>'}`}
function tela(){if(!E)return;const top=scrollY;app.innerHTML=`<header><h1><span>YT-Pub</span> X3 Master</h1><div class="meta"><span class="badge ${E.publicando?'on':'p'}">${E.publicando?'Publicando de verdade':'Simulação: nada é publicado'}</span><span class="badge">v${esc(E.versao)}</span><span>${esc(E.agora)}</span></div></header>${sel?telaCanal():telaGeral()}`;scrollTo(0,top)}
async function carregar(){const r=await fetch('/api/estado');E=await r.json();if(sel)det=await (await fetch('/api/canal/'+sel)).json();tela()}
async function post(u){const r=await fetch(u,{method:'POST',headers:{'X-X3':'1'}});if(!r.ok&&r.status!==409)alert('Não consegui aplicar a ação.');await carregar()}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.f){filtro=d.f;tela()}else if(d.per){const[c,n]=d.per.split(':');per[c]=+n;tela()}else if(d.abre){sel=d.abre;tab='yt';det=null;scrollTo(0,0);carregar()}else if(d.volta){sel=null;det=null;tela()}else if(d.tab){tab=d.tab;tela()}else if(d.ent)post('/api/entrega/'+d.ent);else if(d.sw)post('/api/destino/'+d.sw)});
carregar();setInterval(carregar,30000);
</script></body></html>
